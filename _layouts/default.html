<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="google-site-verification" content="Wp5QHoAVFAbR4ccbb3UO2pOXfwiTKWP6S6QWG0hFpEw" />
  {% seo %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:opsz,wght@10..72,400;10..72,500;10..72,600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <h1 class="site-name"><a href="{{ '/' | relative_url }}">{{ site.name }}</a></h1>
    <nav>
      <ul class="site-nav">
        {% for item in site.nav %}
        <li><a href="{{ item.link | relative_url }}">{{ item.name }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </header>

  <main class="container">
    {{ content }}
  </main>
</body>
</html>
